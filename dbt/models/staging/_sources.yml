version: 2

sources:
  - name: olist
    description: >
      CSVs originais da Olist (Kaggle, CC BY-NC-SA 4.0), lidos direto de DATA_DIR/raw.
      Tudo é lido como texto (all_varchar) e convertido nos modelos de staging,
      para preservar zeros à esquerda dos CEPs e controlar os tipos.
    config:
      meta:
        external_location: >-
          read_csv('{{ env_var('DATA_DIR', 'data') }}/raw/{name}.csv',
          header = true, all_varchar = true, quote = '"', escape = '"')
    tables:
      - name: olist_orders_dataset
      - name: olist_customers_dataset
      - name: olist_order_items_dataset
      - name: olist_order_payments_dataset
      - name: olist_order_reviews_dataset
      - name: olist_products_dataset
      - name: olist_sellers_dataset
      - name: olist_geolocation_dataset
      - name: product_category_name_translation
