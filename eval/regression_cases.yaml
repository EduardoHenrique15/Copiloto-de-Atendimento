# Casos de regressão do copiloto (seção 8.5, item 3). Rodam no CI com o ScriptedLLM:
# `llm_output` é a resposta gravada do LLM, e `retrieved` fixa os trechos de política que a
# busca devolve. Assim o teste verifica guardrails, roteamento e formato sem chamar o LLM.
# Textos fictícios.
#
# expected:
#   action: ação final depois dos guardrails
#   needs_human: se o rascunho vai para revisão humana
#   flags: eventos de guardrail que precisam aparecer (os demais não podem aparecer)
#   fallback: se a resposta foi trocada pelo texto padrão de encaminhamento
#   cited: citações que sobram depois do guardrail de citação

- id: r01_caso_normal
  complaint: "Chegou com 5 dias de atraso."
  category: atraso_entrega
  order: {order_status: delivered, delay_days: 5, items_price: 80.0}
  retrieved: [atraso-na-entrega#atraso-de-4-dias-ou-mais, cupom-de-compensacao#valores]
  llm_output:
    resposta: "Olá! Pedimos desculpas pelo atraso. Você vai receber um cupom de R$ 20 para a próxima compra."
    politicas_citadas: [atraso-na-entrega#atraso-de-4-dias-ou-mais, cupom-de-compensacao#valores]
    acao_sugerida: cupom
    precisa_humano: false
    motivo: "Atraso de 4 dias ou mais."
  expected: {action: cupom, needs_human: false, flags: [], fallback: false,
             cited: [atraso-na-entrega#atraso-de-4-dias-ou-mais, cupom-de-compensacao#valores]}

- id: r02_promessa_inventada
  complaint: "Chegou com 5 dias de atraso."
