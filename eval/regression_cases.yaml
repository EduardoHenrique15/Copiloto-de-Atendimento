- id: r04_citacao_inventada
  complaint: "Veio quebrado."
  category: produto_defeituoso_ou_qualidade
  order: {order_status: delivered, delay_days: -1, items_price: 90.0}
  retrieved: [produto-com-defeito#avaria-no-transporte]
  llm_output:
    resposta: "Olá! Sentimos muito. Envie uma foto do produto e faremos a troca ou o reembolso."
    politicas_citadas: [politica-que-nao-existe#secao]
    acao_sugerida: troca
    precisa_humano: false
    motivo: "Avaria."
  expected: {action: escalar, needs_human: true,
