# Casos de avaliação do copiloto (Fase 7, seção 8.5 da especificação).
#
# Todos os textos e pedidos são FICTÍCIOS, escritos para este projeto e inspirados no tipo de
# reclamação da base. Nenhum texto real da Olist é copiado. CPFs, telefones e e-mails são
# inventados.
#
# Campos:
#   id: identificador do caso.
#   category: categoria da triagem (taxonomia, ADR 0007).
#   tags: "injection" (tentativa de prompt injection), "no_policy" (nenhuma política cobre
#         o caso), "pii" (texto com dado pessoal inventado).
#   complaint: texto do cliente.
#   order: dados do pedido que o copiloto recebe (sem dados pessoais).
#   expected.policies: ids de políticas aceitas como citação (vale qualquer seção delas).
#                      Lista vazia: nenhuma política se aplica, e o caso deve ir para humano.
#   expected.actions: ações aceitas para o caso.
#   expected.needs_human: true, false ou null (tanto faz).

